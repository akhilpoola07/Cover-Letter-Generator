# Render Blueprint Configuration (render.yaml)
# Use this to spin up your entire stack (Backend, Frontend, and Database) on Render.
# Simply link your repository to Render Blueprints: https://dashboard.render.com/blueprints

services:
  # ----------------------------------------------------
  # 🐍 1. BACKEND: Python Flask Web Service
  # ----------------------------------------------------
  - type: web
    name: cover-letter-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # Generates a secure random 256-bit key automatically
      - key: JWT_SECRET_KEY
        generateValue: true # Generates a secure random JWT key automatically
      - key: DATABASE_URL
        fromDatabase:
          name: cover-letter-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # You will enter your OpenAI API key in the Render dashboard
      - key: FRONTEND_URL
        sync: false # You will enter your deployed Frontend URL (for CORS allowance)

  # ----------------------------------------------------
  # 💻 2. FRONTEND: React / Vite Static Site
  # ----------------------------------------------------
  - type: web
    name: cover-letter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # You will enter your deployed Backend URL + /api
    routes:
      # Rewrite all requests to index.html to support React Router SPA routing (prevents 404s on reload)
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ----------------------------------------------------
  # 🐘 3. DATABASE: PostgreSQL Database
  # ----------------------------------------------------
  - name: cover-letter-db
    plan: free # Deploys on Render's Free Postgres tier
